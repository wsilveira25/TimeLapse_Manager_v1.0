<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acesso | Timelapse Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { color-scheme: dark; }
        body { min-height: 100vh; background: #111722; color: #f4f7fb; }
        .login-shell { min-height: calc(100vh - 58px); display: grid; place-items: center; padding: 24px; }
        .login-panel { width: min(100%, 380px); padding: 28px; background: #1d2735; border: 1px solid #354255; border-radius: 8px; box-shadow: 0 18px 50px rgba(0,0,0,.28); }
        .brand-mark { width: 44px; height: 44px; display: grid; place-items: center; color: #15c4d9; background: rgba(21,196,217,.12); border-radius: 8px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary">
        <div class="container"><span class="navbar-brand mb-0"><i class="fa-solid fa-camera-retro me-2"></i>Timelapse Manager</span></div>
    </nav>
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <div class="brand-mark mb-3"><i class="fa-solid fa-camera"></i></div>
            <h1 id="login-title" class="h4 mb-1">Entrar</h1>
            <p class="text-light opacity-75 small mb-4">Acesse o painel de câmeras e armazenamentos.</p>
            {% if erro %}
            <div class="alert alert-danger py-2 small" role="alert">Usuário ou senha inválidos.</div>
            {% endif %}
            <form action="/login" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuário</label>
                    <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Senha</label>
                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-info w-100 fw-semibold" type="submit">Acessar painel</button>
            </form>
            <a class="d-inline-block small mt-3" href="/forgot-password">Esqueci minha senha</a>
            <div class="small text-light opacity-50 text-end mt-4">{{ developer_signature }}</div>
        </section>
    </main>
</body>
</html>
