<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redefinir senha | Timelapse Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        body { min-height: 100vh; background: #111722; color: #f4f7fb; }
        main { min-height: calc(100vh - 58px); display: grid; place-items: center; padding: 24px; }
        .panel { width: min(100%, 420px); padding: 28px; background: #1d2735; border: 1px solid #354255; border-radius: 8px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary"><div class="container"><span class="navbar-brand mb-0">Timelapse Manager</span></div></nav>
    <main><section class="panel">
        <h1 class="h4">Definir nova senha</h1>
        <p class="text-light opacity-75 small">Use pelo menos 12 caracteres. O link expira em 30 minutos.</p>
        <form id="reset-form">
            <input type="hidden" id="reset-token" value="{{ token }}">
            <label class="form-label" for="new-password">Nova senha</label>
            <input class="form-control mb-3" id="new-password" type="password" minlength="12" autocomplete="new-password" required>
            <label class="form-label" for="confirm-password">Confirmar senha</label>
            <input class="form-control mb-3" id="confirm-password" type="password" minlength="12" autocomplete="new-password" required>
            <button class="btn btn-info w-100" type="submit">Redefinir senha</button>
        </form>
        <div id="reset-feedback" class="small mt-3" role="status" aria-live="polite">{% if erro %}{{ erro }}{% endif %}</div>
        <div class="small text-light opacity-50 text-end mt-4">{{ developer_signature }}</div>
    </section></main>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const feedback = document.getElementById('reset-feedback');
            const body = new URLSearchParams({
                token: document.getElementById('reset-token').value,
                password: document.getElementById('new-password').value,
                password_confirm: document.getElementById('confirm-password').value,
            });
            try {
                const response = await fetch('/api/auth/reset', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || 'Não foi possível redefinir a senha.');
                feedback.textContent = result.mensagem;
                feedback.className = 'small mt-3 text-success';
                window.setTimeout(() => { window.location.href = '/login'; }, 1800);
            } catch (error) {
                feedback.textContent = error.message || 'Não foi possível redefinir a senha.';
                feedback.className = 'small mt-3 text-danger';
            }
        });
    </script>
</body>
</html>
