<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar acesso | Timelapse Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        body { min-height: 100vh; background: #111722; color: #f4f7fb; }
        main { min-height: calc(100vh - 58px); display: grid; place-items: center; padding: 24px; }
        .panel { width: min(100%, 420px); padding: 28px; background: #1d2735; border: 1px solid #354255; border-radius: 8px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark border-bottom border-secondary"><div class="container"><span class="navbar-brand mb-0">Timelapse Manager</span></div></nav>
    <main><section class="panel">
        <h1 class="h4">Recuperar senha</h1>
        <p class="text-light opacity-75 small">Informe o e-mail de recuperação cadastrado.</p>
        <form id="forgot-form">
            <label class="form-label" for="recovery-email">E-mail</label>
            <input class="form-control mb-3" id="recovery-email" type="email" autocomplete="email" required>
            <button class="btn btn-info w-100" type="submit">Enviar instruções</button>
        </form>
        <div id="forgot-feedback" class="small mt-3" role="status" aria-live="polite"></div>
        <a class="d-inline-block small mt-3" href="/login">Voltar ao login</a>
        <div class="small text-light opacity-50 text-end mt-4">{{ developer_signature }}</div>
    </section></main>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const feedback = document.getElementById('forgot-feedback');
            const body = new URLSearchParams({ email: document.getElementById('recovery-email').value });
            try {
                const response = await fetch('/api/auth/forgot', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
                const result = await response.json();
                feedback.textContent = result.mensagem || 'Se o e-mail estiver cadastrado, enviaremos instruções.';
                feedback.className = 'small mt-3 text-info';
            } catch {
                feedback.textContent = 'Não foi possível processar o pedido agora.';
                feedback.className = 'small mt-3 text-danger';
            }
        });
    </script>
</body>
</html>
